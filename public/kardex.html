<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>UMSS - Kardex Académico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="assets/logo-umss.png" alt="Logo UMSS" />
    <div>
      <div class="titulo">UMSS</div>
      <div class="subtitulo">Universidad Mayor de San Simón</div>
    </div>
  </div>
  <div class="topbar-usuario">
    <span data-nombre-usuario></span>
    <button class="logout" data-logout title="Cerrar sesión">&#x2192;&#x2503;</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <a href="estado.html">&#128203; Estado de Inscripción</a>
    <a href="kardex.html" class="activo">&#128196; Kardex</a>
    <a href="inscripcion.html">&#9998; Inscripción</a>
    <a href="malla.html">&#9638; Malla Curricular</a>
  </div>

  <div class="contenido">
    <h1>Kardex Académico</h1>

    <div class="card">
      <table>
        <thead>
          <tr><th>Gestión/Semestre</th><th>Sigla</th><th>Materia</th><th>Nota Final</th><th>Estado</th></tr>
        </thead>
        <tbody id="tabla-kardex"></tbody>
      </table>
      <div id="sin-datos" class="centro-vacio" style="display:none;">Aún no tienes materias registradas en tu historial académico.</div>
    </div>

    <div class="footer-stats">
      <div class="stat-box">Promedio General: <b id="promedio">0</b></div>
      <div class="stat-box">Materias Aprobadas: <b id="materias-aprobadas">0</b></div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/kardex.js"></script>
</body>
</html>
