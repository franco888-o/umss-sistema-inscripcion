<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>UMSS - Iniciar Sesión</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-bg">
  <div class="login-card">
    <div class="brand">
      <img src="assets/logo-umss.png" alt="Logo UMSS" />
      <div>
        <div class="titulo">UMSS</div>
        <div class="subtitulo">Universidad Mayor de San Simón<br/>Facultad de Ciencias y Tecnología</div>
      </div>
    </div>
    <h2>Iniciar Sesión</h2>
    <form id="form-login">
      <div class="form-group">
        <input type="text" id="username" placeholder="Usuario" autocomplete="username" required />
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required />
      </div>
      <div id="error-login" class="alerta-error" style="display:none;"></div>
      <button type="submit" class="btn btn-primario">Iniciar Sesión</button>
    </form>
    <div class="login-hint">
      Usuario: <b>Israel Espinoza</b> &middot; Contraseña: tu código SIS
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('error-login');
  errorBox.style.display = 'none';

  try {
    await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username, password }),
    });
    window.location.href = 'estado.html';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
  }
});
</script>
</body>
</html>
